<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPhone</title>
  <style>
    :root {
      --sf-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", -system-ui, sans-serif;
      --accent-blue: #0a84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: var(--sf-font);
      color: #ffffff;
    }

    /* Full-screen Wallpaper Layer */
    .wallpaper-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: linear-gradient(180deg, #182236 0%, #0d121c 50%, #07090e 100%);
      z-index: 1;
    }

    /* Subtle blurred overlay over the wallpaper */
    .wallpaper-blur-overlay {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      background: rgba(0, 0, 0, 0.42);
      z-index: 2;
    }

    /* Main Container (Vertically Centered Pure Passcode Interface) */
    .passcode-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: calc(env(safe-area-inset-top, 44px) + 20px);
      padding-bottom: calc(env(safe-area-inset-bottom, 24px) + 20px);
    }

    /* "Enter Passcode" Prompt */
    .passcode-prompt {
      font-size: 21px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 22px;
      text-align: center;
      cursor: pointer;
    }

    /* 4 Circular Dots */
    .passcode-dots-row {
      display: flex;
      gap: 22px;
      align-items: center;
      justify-content: center;
      margin-bottom: 46px;
      height: 18px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background: transparent;
      transition: background-color 0.12s ease, transform 0.12s ease;
    }

    .dot.filled {
      background: #ffffff;
      transform: scale(1.05);
    }

    /* Shake Animation */
    @keyframes shakeKeypad {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-14px); }
      40%, 80% { transform: translateX(14px); }
    }

    .passcode-dots-row.shake {
      animation: shakeKeypad 0.35s ease;
    }

    /* Keypad 0-9 Grid */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 78px);
      gap: 18px 28px;
      justify-content: center;
      margin: 0 auto;
    }

    .key-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .key-btn:active {
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0.96);
    }

    .key-num {
      font-size: 36px;
      font-weight: 300;
      line-height: 1;
    }

    .key-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 1px;
      color: rgba(255, 255, 255, 0.85);
      height: 12px;
      line-height: 12px;
    }

    /* Bottom Actions: Emergency, 0, Cancel/Delete */
    .bottom-row-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 290px;
      margin: 16px auto 0 auto;
      padding: 0 4px;
    }

    .sub-action-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      padding: 8px 12px;
      font-family: inherit;
      width: 80px;
    }
    .sub-action-btn:first-child { text-align: left; }
    .sub-action-btn:last-child { text-align: right; }

    .sub-action-btn:active {
      opacity: 0.5;
    }

    /* =========================================================
       MULTIPLE CANDIDATES SELECTION SHEET (SPOTLIGHT STYLE)
       ========================================================= */
    .candidates-sheet {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: calc(env(safe-area-inset-top, 40px) + 16px) 20px 24px 20px;
      z-index: 50;
      transform: translateY(-115%);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1);
    }

    .candidates-sheet.open {
      transform: translateY(0);
    }

    .sheet-pill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 13px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sheet-close-btn {
      background: #3a3a3c;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .candidates-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    .candidate-card-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .candidate-card-btn:active {
      background: var(--accent-blue);
      transform: scale(0.98);
    }

    .search-arrow {
      color: #8e8e93;
      font-size: 16px;
    }

    /* =========================================================
       SECRET SETTINGS MODAL (WALLPAPER + CATEGORY)
       ========================================================= */
    .settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 40px) + 16px) 20px calc(env(safe-area-inset-bottom, 20px) + 16px) 20px;
      overflow-y: auto;
    }

    .settings-modal.show {
      display: flex;
    }

    .settings-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .settings-card-title {
      font-size: 13px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .settings-row:last-child { border-bottom: none; }

    select, input[type="text"] {
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .action-pill-btn {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .close-settings-btn {
      width: 100%;
      background: #2c2c2e;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Full-screen Wallpaper Layer -->
  <div class="wallpaper-bg" id="wallpaperLayer"></div>
  <div class="wallpaper-blur-overlay"></div>

  <!-- Pure Passcode Interface -->
  <div class="passcode-container">

    <!-- "Enter Passcode" Prompt (Long press opens hidden settings) -->
    <div class="passcode-prompt" id="passcodePrompt">Enter Passcode</div>

    <!-- 4 Dots Row -->
    <div class="passcode-dots-row" id="dotsRow">
      <div class="dot" id="dot0"></div>
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <!-- 10 Circular Keys (1-9) -->
    <div class="keypad-grid">
      <!-- 1 -->
      <button class="key-btn" onclick="pressDigit('1')">
        <div class="key-num">1</div>
        <div class="key-sub">&nbsp;</div>
      </button>
      <!-- 2 -->
      <button class="key-btn" onclick="pressDigit('2')">
        <div class="key-num">2</div>
        <div class="key-sub">ABC</div>
      </button>
      <!-- 3 -->
      <button class="key-btn" onclick="pressDigit('3')">
        <div class="key-num">3</div>
        <div class="key-sub">DEF</div>
      </button>
      <!-- 4 -->
      <button class="key-btn" onclick="pressDigit('4')">
        <div class="key-num">4</div>
        <div class="key-sub">GHI</div>
      </button>
      <!-- 5 -->
      <button class="key-btn" onclick="pressDigit('5')">
        <div class="key-num">5</div>
        <div class="key-sub">JKL</div>
      </button>
      <!-- 6 -->
      <button class="key-btn" onclick="pressDigit('6')">
        <div class="key-num">6</div>
        <div class="key-sub">MNO</div>
      </button>
      <!-- 7 -->
      <button class="key-btn" onclick="pressDigit('7')">
        <div class="key-num">7</div>
        <div class="key-sub">PQRS</div>
      </button>
      <!-- 8 -->
      <button class="key-btn" onclick="pressDigit('8')">
        <div class="key-num">8</div>
        <div class="key-sub">TUV</div>
      </button>
      <!-- 9 -->
      <button class="key-btn" onclick="pressDigit('9')">
        <div class="key-num">9</div>
        <div class="key-sub">WXYZ</div>
      </button>
    </div>

    <!-- Keypad Bottom Row: Emergency, 0, Cancel/Delete -->
    <div class="bottom-row-actions">
      <button class="sub-action-btn" id="emergencyBtn" onclick="handleEmergencyClick()">Emergency</button>
      <!-- 0 -->
      <button class="key-btn" onclick="pressDigit('0')">
        <div class="key-num">0</div>
        <div class="key-sub" style="font-size:12px;letter-spacing:0;">+</div>
      </button>
      <button class="sub-action-btn" id="cancelBtn" onclick="handleCancelClick()">Cancel</button>
    </div>

  </div>

  <!-- ========================================================
       MULTIPLE MATCHES CANDIDATES SHEET
       ======================================================== -->
  <div class="candidates-sheet" id="candidatesSheet">
    <div class="sheet-pill-header">
      <div class="sheet-title">Candidate Words</div>
      <button class="sheet-close-btn" onclick="dismissCandidates()">Cancel</button>
    </div>
    <div class="candidates-list" id="candidatesList">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- ========================================================
       SECRET SETTINGS PANEL (WALLPAPER + CATEGORY)
       ======================================================== -->
  <div class="settings-modal" id="settingsModal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <h2 style="font-size:22px;font-weight:700;">Settings</h2>
      <button class="action-pill-btn" style="background:#3a3a3c;" onclick="closeSettings()">Done</button>
    </div>

    <!-- Wallpaper Upload -->
    <div class="settings-card">
      <div class="settings-card-title">Custom Wallpaper</div>
      <p style="font-size:13px;color:#8e8e93;margin-bottom:12px;">
        Upload a screenshot or photo of your real lock screen wallpaper.
      </p>
      <div style="display:flex;gap:10px;align-items:center;">
        <input type="file" id="wallpaperFileInput" accept="image/*" style="display:none;" onchange="handleWallpaperUpload(event)">
        <button class="action-pill-btn" onclick="document.getElementById('wallpaperFileInput').click()">Choose Photo</button>
        <button class="action-pill-btn" style="background:#ff453a;" onclick="resetWallpaper()">Reset</button>
      </div>
    </div>

    <!-- Category -->
    <div class="settings-card">
      <div class="settings-card-title">Category</div>
      <div class="settings-row">
        <span>Category:</span>
        <select id="categorySelect" onchange="changeCategory(this.value)">
          <option value="objects">Everyday Objects (Default)</option>
          <option value="animals">Animals</option>
          <option value="countries">Countries &amp; Cities</option>
          <option value="food">Food &amp; Drinks</option>
          <option value="all">All Words (Combined)</option>
        </select>
      </div>
    </div>

    <!-- Practice Lookup -->
    <div class="settings-card">
      <div class="settings-card-title">Word Code Finder</div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="text" id="testWordInput" placeholder="Enter word e.g. Spoon, Drill" style="flex:1;">
        <button class="action-pill-btn" onclick="lookupWordCode()">Check</button>
      </div>
      <div id="testWordResult" style="font-size:14px;color:#30d158;font-weight:600;"></div>
    </div>

    <button class="close-settings-btn" onclick="closeSettings()">Close</button>
  </div>

  <!-- Load Dictionary Data -->
  <script src="dictionary.js"></script>

  <script>
    "use strict";

    let currentInput = "";
    let activeCategory = localStorage.getItem("enigma_category") || "objects";
    let isUnlocked = false;

    const dots = [
      document.getElementById("dot0"),
      document.getElementById("dot1"),
      document.getElementById("dot2"),
      document.getElementById("dot3")
    ];
    const dotsRow = document.getElementById("dotsRow");
    const cancelBtn = document.getElementById("cancelBtn");
    const candidatesSheet = document.getElementById("candidatesSheet");
    const candidatesList = document.getElementById("candidatesList");
    const settingsModal = document.getElementById("settingsModal");
    const wallpaperLayer = document.getElementById("wallpaperLayer");

    // Init wallpaper from localStorage
    function initWallpaper() {
      const saved = localStorage.getItem("enigma_custom_wallpaper");
      if (saved) {
        wallpaperLayer.style.backgroundImage = `url(${saved})`;
      }
    }
    initWallpaper();

    function handleWallpaperUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64 = evt.target.result;
        try {
          localStorage.setItem("enigma_custom_wallpaper", base64);
          wallpaperLayer.style.backgroundImage = `url(${base64})`;
          alert("Wallpaper set successfully!");
        } catch (_) {
          alert("Image file too large for browser storage. Please try a smaller photo.");
        }
      };
      reader.readAsDataURL(file);
    }

    function resetWallpaper() {
      localStorage.removeItem("enigma_custom_wallpaper");
      wallpaperLayer.style.backgroundImage = "linear-gradient(180deg, #182236 0%, #0d121c 50%, #07090e 100%)";
      alert("Reset to default background.");
    }

    // Keypad Logic
    function pressDigit(num) {
      if (isUnlocked) return;
      if (currentInput.length >= 4) return;

      if (navigator.vibrate) navigator.vibrate([10]);

      currentInput += num;
      updateDots();

      // If 3 digits, check for exact single-vowel match (e.g. 421 for Fork)
      if (currentInput.length === 3) {
        const matches = findMatches(currentInput);
        if (matches && matches.length === 1) {
          triggerUnlock(matches[0]);
          return;
        }
      }

      // If 4 digits, resolve match
      if (currentInput.length === 4) {
        setTimeout(processCode, 100);
      }
    }

    function handleCancelClick() {
      if (currentInput.length > 0) {
        // Delete last digit
        currentInput = currentInput.slice(0, -1);
        updateDots();
      }
    }

    let emergencyTapCount = 0;
    let emergencyTimer = null;
    function handleEmergencyClick() {
      emergencyTapCount++;
      clearTimeout(emergencyTimer);
      emergencyTimer = setTimeout(() => { emergencyTapCount = 0; }, 600);
      if (emergencyTapCount >= 2) {
        emergencyTapCount = 0;
        openSettings();
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        if (i < currentInput.length) {
          dots[i].classList.add("filled");
        } else {
          dots[i].classList.remove("filled");
        }
      }
      cancelBtn.textContent = currentInput.length > 0 ? "Delete" : "Cancel";
    }

    function clearDots() {
      currentInput = "";
      updateDots();
    }

    function shakeDots() {
      dotsRow.classList.add("shake");
      if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
      setTimeout(() => {
        dotsRow.classList.remove("shake");
        clearDots();
      }, 380);
    }

    // Enigma Dictionary Match Finder
    function findMatches(code) {
      if (!window.ENIGMA_DATA || !window.ENIGMA_DATA.database) return [];

      const db = window.ENIGMA_DATA.database;
      const catKey = `${activeCategory}:${code}`;
      if (db[catKey] && db[catKey].length > 0) {
        return db[catKey];
      }

      const allKey = `all:${code}`;
      if (db[allKey] && db[allKey].length > 0) {
        return db[allKey];
      }

      return [];
    }

    function processCode() {
      const candidates = findMatches(currentInput);

      if (!candidates || candidates.length === 0) {
        shakeDots();
        return;
      }

      if (candidates.length === 1) {
        triggerUnlock(candidates[0]);
      } else {
        showCandidatesSheet(candidates);
      }
    }

    function showCandidatesSheet(words) {
      candidatesList.innerHTML = "";
      words.forEach((w) => {
        const btn = document.createElement("button");
        btn.className = "candidate-card-btn";
        btn.innerHTML = `<span>${w}</span><span class="search-arrow">Google &rarr;</span>`;
        btn.onclick = () => {
          dismissCandidates();
          triggerUnlock(w);
        };
        candidatesList.appendChild(btn);
      });
      candidatesSheet.classList.add("open");
    }

    function dismissCandidates() {
      candidatesSheet.classList.remove("open");
      clearDots();
    }

    // Real Safari Handoff via x-safari-https
    function triggerUnlock(word) {
      isUnlocked = true;
      dots.forEach(d => d.style.background = "#30d158");

      const query = encodeURIComponent(word.toLowerCase());
      const safariScheme = `x-safari-https://www.google.com/search?q=${query}`;
      const regularUrl = `https://www.google.com/search?q=${query}`;

      setTimeout(() => {
        window.location.href = safariScheme;

        // Fallback for desktop/non-Aura
        setTimeout(() => {
          window.location.href = regularUrl;
        }, 300);
      }, 120);
    }

    // Secret Settings access: Double tap Emergency or long press "Enter Passcode"
    let promptPressTimer = null;
    const promptEl = document.getElementById("passcodePrompt");
    promptEl.addEventListener("touchstart", () => {
      promptPressTimer = setTimeout(openSettings, 800);
    });
    promptEl.addEventListener("touchend", () => {
      clearTimeout(promptPressTimer);
    });
    promptEl.addEventListener("dblclick", openSettings);

    function openSettings() {
      document.getElementById("categorySelect").value = activeCategory;
      settingsModal.classList.add("show");
    }

    function closeSettings() {
      settingsModal.classList.remove("show");
    }

    function changeCategory(cat) {
      activeCategory = cat;
      localStorage.setItem("enigma_category", cat);
    }

    function computeWordCode(word) {
      const w = word.trim().toUpperCase().replace(/[^A-Z]/g, "");
      if (!w) return null;
      const L = w.length;
      const lenCode = L < 10 ? String(L) : (L === 10 ? "0" : "1");

      const vowels = "AEIOU";
      const vPos = [];
      for (let i = 0; i < w.length; i++) {
        if (vowels.includes(w[i])) vPos.push(i + 1);
      }

      function shapeOf(ch) {
        if ("AEFHIKLMNTVWXYZ".includes(ch)) return "1";
        if ("BDGJPRU".includes(ch)) return "2";
        if ("COQS".includes(ch)) return "3";
        return "1";
      }
      const shape = shapeOf(w[0]);

      if (vPos.length === 0) return `${lenCode}00${shape}`;
      if (vPos.length === 1) return `${lenCode}${vPos[0]}${shape} (or ${lenCode}${vPos[0]}0${shape})`;
      return `${lenCode}${vPos[0]}${vPos[1]}${shape}`;
    }

    function lookupWordCode() {
      const val = document.getElementById("testWordInput").value;
      if (!val) return;
      const code = computeWordCode(val);
      document.getElementById("testWordResult").textContent = `Word: "${val}" -> Code: ${code}`;
    }
  </script>
</body>
</html>
